[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feishincli"
version = "0.1.0"
description = "A command line remote interface for Feishin."
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
# note: only tested on 3.12
dependencies = [
    "prompt_toolkit>=3.0.52",
    "pyfiglet>=1.0.4",
    "websockets>=16.1.1",
]
